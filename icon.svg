<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="0" fill="#0f0f1a"/>
  <!-- Game controller body -->
  <rect x="96" y="176" width="320" height="200" rx="80" fill="#1a1a2e"/>
  <!-- Left bumper / grip -->
  <ellipse cx="148" cy="260" rx="52" ry="68" fill="#1a1a2e"/>
  <!-- Right bumper / grip -->
  <ellipse cx="364" cy="260" rx="52" ry="68" fill="#1a1a2e"/>
  <!-- D-pad horizontal -->
  <rect x="140" y="240" width="68" height="24" rx="6" fill="#ff6b6b"/>
  <!-- D-pad vertical -->
  <rect x="166" y="216" width="24" height="68" rx="6" fill="#ff6b6b"/>
  <!-- Buttons ABXY -->
  <circle cx="336" cy="228" r="14" fill="#ff6b6b" opacity="0.9"/>
  <circle cx="368" cy="252" r="14" fill="#ff6b6b" opacity="0.7"/>
  <circle cx="336" cy="276" r="14" fill="#ff6b6b" opacity="0.7"/>
  <circle cx="304" cy="252" r="14" fill="#ff6b6b" opacity="0.9"/>
  <!-- Center button -->
  <circle cx="256" cy="252" r="16" fill="#ff6b6b" opacity="0.6"/>
  <!-- Analog sticks (subtle) -->
  <circle cx="198" cy="300" r="18" fill="#252545"/>
  <circle cx="314" cy="300" r="18" fill="#252545"/>
</svg>
