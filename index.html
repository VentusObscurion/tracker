<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <title>Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">Tracker</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-export" title="Exportieren">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
        <label class="icon-btn" for="file-import" title="Importieren" role="button" tabindex="0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </label>
        <input type="file" id="file-import" accept=".json" aria-hidden="true">
      </div>
    </header>

    <!-- Tab Bar -->
    <nav class="tab-bar" role="tablist">
      <button class="tab-btn active" data-tab="games" role="tab" aria-selected="true">
        🎮 <span>Spiele</span>
      </button>
      <button class="tab-btn" data-tab="anime" role="tab" aria-selected="false">
        🌸 <span>Anime</span>
      </button>
    </nav>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="input-search" placeholder="Suchen..." inputmode="search" autocomplete="off" aria-label="Suchen">
      </div>
      <div class="filter-selects">
        <select id="filter-status" aria-label="Status filtern">
          <option value="">Alle Status</option>
        </select>
        <select id="filter-genre" aria-label="Genre filtern">
          <option value="">Alle Genres</option>
        </select>
        <select id="sort-by" aria-label="Sortierung">
          <option value="dateAdded-desc">Neueste zuerst</option>
          <option value="dateAdded-asc">Älteste zuerst</option>
          <option value="title-asc">A–Z</option>
          <option value="title-desc">Z–A</option>
          <option value="rating-desc">Beste Bewertung</option>
          <option value="dateLast-desc">Zuletzt gespielt</option>
        </select>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar" id="stats-bar" aria-live="polite"></div>

    <!-- Cards Grid -->
    <main class="cards-grid" id="cards-grid" role="list"></main>

    <!-- Empty State -->
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">🎯</div>
      <p class="empty-title">Noch leer hier!</p>
      <p class="empty-sub">Tippe auf <kbd>+</kbd> um loszulegen.</p>
    </div>

    <!-- FAB -->
    <button class="fab" id="btn-add" aria-label="Hinzufügen">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>

  </div><!-- #app -->

  <!-- ============ FORM MODAL ============ -->
  <div class="modal-backdrop" id="modal-form-backdrop" aria-hidden="true">
    <div class="modal" id="modal-form" role="dialog" aria-modal="true" aria-labelledby="modal-form-title">
      <div class="modal-header">
        <h2 id="modal-form-title">Neuer Eintrag</h2>
        <button class="modal-close" id="modal-form-close" aria-label="Schließen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modal-form-body">
        <form id="entry-form" novalidate>
          <!-- Populated by JS -->
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="modal-form-cancel">Abbrechen</button>
        <button type="submit" form="entry-form" class="btn btn-primary">Speichern</button>
      </div>
    </div>
  </div>

  <!-- ============ DETAIL MODAL ============ -->
  <div class="modal-backdrop" id="modal-detail-backdrop" aria-hidden="true">
    <div class="modal" id="modal-detail" role="dialog" aria-modal="true" aria-labelledby="modal-detail-title">
      <div class="modal-header">
        <h2 id="modal-detail-title">Details</h2>
        <button class="modal-close" id="modal-detail-close" aria-label="Schließen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modal-detail-body">
        <!-- Populated by JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="btn-detail-delete">Löschen</button>
        <button class="btn btn-primary" id="btn-detail-edit">Bearbeiten</button>
      </div>
    </div>
  </div>

  <!-- ============ CONFIRM MODAL ============ -->
  <div class="modal-backdrop modal-centered" id="modal-confirm-backdrop" aria-hidden="true">
    <div class="modal modal-sm" id="modal-confirm" role="alertdialog" aria-modal="true">
      <div class="modal-header">
        <h2>Wirklich löschen?</h2>
      </div>
      <div class="modal-body">
        <p id="modal-confirm-text"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-confirm-cancel">Abbrechen</button>
        <button class="btn btn-danger" id="btn-confirm-ok">Löschen</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
